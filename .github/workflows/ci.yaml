name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        # Pinned to v6.2: this action publishes no moving major tag, so both
        # @v7 (never released — latest is 6.x) and @v6 fail to resolve, and an
        # unresolvable action kills the job in "Set up job" before any step
        # runs. That is silent as far as this repo is concerned: main is green
        # on `test`, only `release` fails, so a merged fix looks shipped while
        # no tag is ever cut. Bump this deliberately against the action's
        # released tags.
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Fetch new tag
        run: git fetch --tags

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.new_tag }}
